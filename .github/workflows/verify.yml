name: Verify

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discovery-repair-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: course_discovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d course_discovery_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/course_discovery_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/course_discovery_test
      COURSE_DISCOVERY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/course_discovery_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npx vitest run src/lib/course-discovery/engineering-repair.postgres.test.ts
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Verify the installed browser runtime
        run: |
          node -e "require('@playwright/test').chromium.launch({ headless: true }).then(browser => browser.close()).catch(error => { console.error(error); process.exit(1); })"
      - run: npm run prisma:generate
      - run: npm run check:dead-code
      - run: npm run test:run
      - run: npm run test:learning-worker
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
